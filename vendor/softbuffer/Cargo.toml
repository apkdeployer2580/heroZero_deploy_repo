# ★ VENDORED FORK of softbuffer 0.4.8 (crates.io), patched in from the workspace root.
#
# WHY: the Android backend's present path is on this app's per-frame critical path and
# upstream's version is quadratically wasteful for a 1080x2340 window:
#   1. `buffer_mut()` allocated AND ZEROED a fresh `vec![0; w * h]` on every single call
#      — ~10.1 MB of malloc + memset per frame — even though `redraw()` overwrites every
#      pixel of the window before presenting, so the zeroing was 100 % dead work.
#   2. `present()` swizzled BGRA->RGBA with four separate `MaybeUninit::write` calls per
#      pixel: ~10 M individual byte stores per frame. (Upstream even carries a
#      `// TODO: This function is pretty slow this way` there.)
# Both are fixed in `src/backends/android.rs` + `src/util.rs`; every changed hunk is
# marked `★ wie fork:` so the next upstream bump can find and re-apply them.
#
# Everything else is a byte-for-byte copy of the published crate. Only the ANDROID
# backend is touched — x11/wayland/win32/cg/kms/web/orbital are untouched upstream code.
#
# This file is the registry-normalized `Cargo.toml` of softbuffer 0.4.8 with two edits:
# the `[[bench]]` target and all `[dev-dependencies]` were deleted, because `benches/`,
# `examples/` and the dev-dep tree (criterion, winit, image, …) were not vendored. They
# are never resolved for a patched path dependency anyway, but leaving a `[[bench]]`
# pointing at a file that does not exist is a trap for whoever next makes this crate a
# workspace member. Nothing else — no dependency, feature or version — was changed.

[package]
edition = "2021"
rust-version = "1.71.0"
name = "softbuffer"
version = "0.4.8"
build = false
exclude = ["examples"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Cross-platform software buffer"
documentation = "https://docs.rs/softbuffer"
readme = "README.md"
keywords = [
    "framebuffer",
    "windowing",
]
categories = [
    "game-development",
    "graphics",
    "gui",
    "multimedia",
    "rendering",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-windowing/softbuffer"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]
default-target = "x86_64-unknown-linux-gnu"
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
]

[features]
default = [
    "kms",
    "x11",
    "x11-dlopen",
    "wayland",
    "wayland-dlopen",
]
kms = [
    "bytemuck",
    "drm",
    "rustix",
]
wayland = [
    "wayland-backend",
    "wayland-client",
    "wayland-sys",
    "memmap2",
    "rustix",
    "fastrand",
]
wayland-dlopen = ["wayland-sys/dlopen"]
x11 = [
    "as-raw-xcb-connection",
    "bytemuck",
    "fastrand",
    "rustix",
    "tiny-xlib",
    "x11rb",
]
x11-dlopen = [
    "tiny-xlib/dlopen",
    "x11rb/dl-libxcb",
]

[lib]
name = "softbuffer"
path = "src/lib.rs"

[dependencies.raw_window_handle]
version = "0.6"
features = ["std"]
package = "raw-window-handle"

[dependencies.tracing]
version = "0.1.41"
default-features = false

[target.'cfg(not(any(target_os = "android", target_vendor = "apple", target_os = "redox", target_family = "wasm", target_os = "windows")))'.dependencies.as-raw-xcb-connection]
version = "1.0.0"
optional = true

[target.'cfg(not(any(target_os = "android", target_vendor = "apple", target_os = "redox", target_family = "wasm", target_os = "windows")))'.dependencies.bytemuck]
version = "1.12.3"
optional = true

[target.'cfg(not(any(target_os = "android", target_vendor = "apple", target_os = "redox", target_family = "wasm", target_os = "windows")))'.dependencies.drm]
version = "0.14.1"
optional = true
default-features = false

[target.'cfg(not(any(target_os = "android", target_vendor = "apple", target_os = "redox", target_family = "wasm", target_os = "windows")))'.dependencies.fastrand]
version = "2.0.0"
optional = true

[target.'cfg(not(any(target_os = "android", target_vendor = "apple", target_os = "redox", target_family = "wasm", target_os = "windows")))'.dependencies.memmap2]
version = "0.9.0"
optional = true

[target.'cfg(not(any(target_os = "android", target_vendor = "apple", target_os = "redox", target_family = "wasm", target_os = "windows")))'.dependencies.rustix]
version = "1.0.1"
features = [
    "fs",
    "mm",
    "shm",
    "std",
]
optional = true
default-features = false

[target.'cfg(not(any(target_os = "android", target_vendor = "apple", target_os = "redox", target_family = "wasm", target_os = "windows")))'.dependencies.tiny-xlib]
version = "0.2.1"
optional = true

[target.'cfg(not(any(target_os = "android", target_vendor = "apple", target_os = "redox", target_family = "wasm", target_os = "windows")))'.dependencies.wayland-backend]
version = "0.3.0"
features = ["client_system"]
optional = true

[target.'cfg(not(any(target_os = "android", target_vendor = "apple", target_os = "redox", target_family = "wasm", target_os = "windows")))'.dependencies.wayland-client]
version = "0.31.0"
optional = true

[target.'cfg(not(any(target_os = "android", target_vendor = "apple", target_os = "redox", target_family = "wasm", target_os = "windows")))'.dependencies.wayland-sys]
version = "0.31.0"
optional = true

[target.'cfg(not(any(target_os = "android", target_vendor = "apple", target_os = "redox", target_family = "wasm", target_os = "windows")))'.dependencies.x11rb]
version = "0.13.0"
features = [
    "allow-unsafe-code",
    "shm",
]
optional = true

[target.'cfg(target_family = "wasm")'.dependencies.js-sys]
version = "0.3.63"

[target.'cfg(target_family = "wasm")'.dependencies.wasm-bindgen]
version = "0.2.86"

[target.'cfg(target_family = "wasm")'.dependencies.web-sys]
version = "0.3.55"
features = [
    "CanvasRenderingContext2d",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "ImageData",
    "OffscreenCanvas",
    "OffscreenCanvasRenderingContext2d",
    "Window",
]

[target.'cfg(target_os = "android")'.dependencies.bytemuck]
version = "1.12.3"

[target.'cfg(target_os = "android")'.dependencies.ndk]
version = "0.9.0"

[target.'cfg(target_os = "redox")'.dependencies.redox_syscall]
version = "0.5"

[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
]

[target.'cfg(target_vendor = "apple")'.dependencies.objc2]
version = "0.6.0"

[target.'cfg(target_vendor = "apple")'.dependencies.objc2-core-foundation]
version = "0.3.2"
features = [
    "std",
    "CFCGTypes",
]
default-features = false

[target.'cfg(target_vendor = "apple")'.dependencies.objc2-core-graphics]
version = "0.3.2"
features = [
    "std",
    "objc2",
    "CGColorSpace",
    "CGDataProvider",
    "CGImage",
]
default-features = false

[target.'cfg(target_vendor = "apple")'.dependencies.objc2-foundation]
version = "0.3.2"
features = [
    "std",
    "objc2-core-foundation",
    "NSDictionary",
    "NSGeometry",
    "NSKeyValueObserving",
    "NSString",
    "NSThread",
    "NSValue",
]
default-features = false

[target.'cfg(target_vendor = "apple")'.dependencies.objc2-quartz-core]
version = "0.3.2"
features = [
    "std",
    "objc2-core-foundation",
    "CALayer",
    "CATransaction",
]
default-features = false
