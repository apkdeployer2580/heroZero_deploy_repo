[[entry.hook]]
kind = "tint_rect565_lgt"
blend_a = 0x150eccc
exit_pc = 0x2ba9d
pc = 0x2b983

# The "동기화" popup, killed at its source (PLAY_FEEDBACK_FIXES 4번).
#
# Player: "그냥 로딩끝나면 별다른 안내없이 나타나면 될거같아. 팝업을 자꾸띄우려고하니까 이거
# 이슈가 발생하는거같아." Repro: enter the warehouse, leave to the slot screen, come
# back -> the box appears; then paging in the cash shop makes it reappear every turn,
# because the client replays its whole open sequence (04 3d / 05 3d / 05 14 / 05 3f) per
# page turn.
#
# THE HANDLER (cat4 op 0x3d, the save-commit ack), verified byte for byte:
#   0x483a  ldrb r3,[r5,#0xb]      ; status
#   0x483e  cmp  r3,#0
#   0x4840  bne  0x485a            ; `0b d1`  <- patched
#   0x4842..0x4858   status == 0: netbox().flag(+0xc) = 1, then strcpy(box+0x10, msg+0xd)
#                    -- this ARMS a latch; the cat5 handler (0x13834) turns it into the box
#   0x485a..0x486a   status != 0: flag = 0, showModal(mode 3) -- a blocking WAIT
#   0x486c..0x4884   BOTH arms fall here and the client SENDS `05 3d 00`
#
# Patching the branch to an unconditional `b 0x486c` skips both arms: no latch, no modal,
# and the `05 3d 00` still goes out byte for byte. That send is the frame that asks the
# server for the warehouse list, so a cat5 round trip ALWAYS follows -- and the cat5
# handler's latch-not-set path is what writes boxMode = 0, i.e. it CLOSES the
# "슬롯 정보 서버에 저장중입니다." WAIT the client raised before uploading. Net effect is
# exactly what the player asked for: loading ends, the list appears, nothing to dismiss.
#
# Encoding: target 0x486c, so offset = 0x486c - (0x4840 + 4) = 0x28, imm11 = 0x14,
# Thumb B = 0xE014 = `14 e0`. `expect` pins the original `bne`, so a different build fails
# the install instead of corrupting an unrelated instruction.
#
# SCOPE: 0x4840 is reachable only from cat == 4 && op == 0x3d. The SAME latch is also armed
# by cat5 op 0x06 -- the 오브 결합 result toast at 0x13abc -- which keeps working untouched.
# The ack itself is NOT withheld (33차 infinite-load); only the box is skipped.
#
# ⚠ RESIDUAL RISK, watch for it: if any path ever leaves the mode-3 WAIT up with no cat5
# frame behind it, there is no longer a dismissible box to replace it. Remove this one entry
# to revert.
[[entry.patch]]
pc = 0x4840
bytes = "14 e0"
expect = "0b d1"

# ── 16TH ORB ROW: the 소켓확장 item's home (2026-08-14) ──────────────────────────
#
# The player asked for the socket-expansion item to be picked out of the NETWORK
# WAREHOUSE and pointed at a piece of equipment, "오브처럼". The game already has that
# exact flow and it is gated on ONE byte: `0x7674 cmp r3,#0x10` reads the WIRE-FED
# category of the highlighted warehouse row, and a match is the only thing that makes the
# context menu 4 rows instead of 3 — row 3 being 오브결합 (flat label table
# 0x5b404 + panel*0x10e + row*0xa). Nothing downstream re-reads the category: the row-3
# handler at 0x724e just stores the row's u64, 0x7608 validates only the TARGET
# (cat <= 0xc), and the sender at 0xc474 re-reads nothing. So the server can serve the
# socket item AS an orb and the whole picker comes for free — no client UI work.
#
# What is NOT free is the row's NAME. The item panel resolves it as `dbPtr[cat][idx]`
# out of `res/dat/i16_dat`, which ships 15 orbs (0x00..0x0e), and the orb table is
# `alloc(0xb4<<1)` = 360 B = exactly 15 x 0x18 with NO bounds check in any reader
# (0x532e8, 0x4f164). Serving idx 0x0f against the stock binary is a wild pointer read
# on the very first list draw. `tools_re/strip_orb_slot_text.py` appends a real 16th
# record (소켓확장) to the asset; these three bytes are what make the guest SEE it.
#
# ⚠ ALL FOUR SHIP TOGETHER — the asset row and these three patches. `expect` pins each
# original byte, and a mismatch is a FatalError, so a drifted build refuses to boot
# instead of quietly overrunning the heap. That is the intended failure mode.
#
# ★ Why patches and not an edit to `binary.mod`: this entry is keyed by that file's MD5.
# Editing it would stop matching, and every hook below — blit565, blend565, blitlut565 —
# would silently stop installing, costing a third to two-thirds of the guest-instruction
# budget. Patching at load time keeps the hash intact.
#
# Row count for category 0x10, in the 19-byte per-category const table at VA 0x5e474
# (`ldrsb` at 0x53eca = the parse loop's entry guard, and at 0x53f86 = its continue test).
[[entry.patch]]
pc = 0x5e484
bytes = "10"
expect = "0f"

# The orb table's backing allocation, a hardcoded immediate — `movs r0,#0xb4` feeding a
# `lsls #1` at 0x53748..0x53752. 0xb4<<1 = 360 = 15 x 0x18; 0xc0<<1 = 384 = 16 x 0x18.
# Unlike the 13 equipment tables (0x5370e) this one does NOT derive its size from the
# count table, which is why the byte above is necessary but not sufficient.
[[entry.patch]]
pc = 0x53748
bytes = "c0"
expect = "b4"

# Teardown bound, `cmp r3,#0xf` at 0x52744 — its own hardcoded copy of the count. Left at
# 15 the 16th row's two strings are never freed. Harmless per session, wrong on principle,
# and one byte to fix.
[[entry.patch]]
pc = 0x52744
bytes = "10"
expect = "0f"

# ── THE ORB HOOKS ARE ROLLED BACK (2026-08-14). Do not re-add without reading this. ──
#
# Three hooks lived here for one day: `orb_sum_lgt` (pc 0x133e5) and two `orb_name_lgt`
# (pc 0x6c0b / 0x6c4d). They made an item carry orbs of DIFFERENT kinds — summing their
# bonuses and chaining their names. The player asked for the feature and then asked for it
# back out; this comment is why it cannot be made to work, so nobody re-derives it.
#
# The blocker is the GAME'S DATA MODEL, not the hook addresses (all three were correct and
# device-proven: the name hooks fired 889x in one session with the right orb lists).
#
#   1. No per-socket storage exists ANYWHERE. All three item representations — the 60-byte
#      inventory instance, the 20-byte warehouse wire record, the 20-byte equipped-slot
#      record — carry only (total sockets, filled count, ONE orb id). Even the socket-gem
#      row drawer 0x415c4 takes just (total, filled); it never learns which orbs.
#   2. ★ THE SAVE CARRIES ONE ORB ID. The save-load deserialiser 0x1a2fc restores
#      +0x3b3/+0x3b6/+0x3b8/+0x3bc/+0x3c5/+0x3c6/+0x3c8/+0x3c9 and then calls 0x528f0,
#      which RECOMPUTES +0x3cc/+0x3ce from that single id. A perfect in-memory sum is
#      erased by the next save load, always.
#   3. The inventory name and the detail panel's effect line both read the instance's one
#      orb id, so a correct stat would still be displayed as a single orb. Device-confirmed:
#      after withdrawing, both the name and the stat show only the last orb.
#   4. Covering it would mean hooking the withdraw path, the save-load recompute, six panel
#      recompute sites (four of which have their own guest bug — they feed the ITEM INDEX
#      into orbTable[X*0x18+0x15], an out-of-table read), the inventory name path and the
#      detail line. Each is a separate failure surface; two of the first two attempts
#      shipped bugs (a hook that never executed, and a 48-vs-30 byte buffer overrun).
#
# Making it work needs a save-format change, which would put live player saves at risk.
# The behaviour is therefore the ORIGINAL one: the last orb socketed is the item's orb, and
# stacking MORE OF THE SAME KIND amplifies it via the game's own
# `orbStat * (filled^2 + filled) / 2`.
#
# The Rust handlers and their tests are kept in `binary_patches/orbsum.rs` — they are
# correct and expensive to re-derive. Re-adding these three entries plus re-enabling
# `ProtocolHandler.ORB_LIST_ENABLED` in hero3_server turns the feature back on.

