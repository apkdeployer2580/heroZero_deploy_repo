# 영웅서기 3 (Hero3) — LGT binary.mod, Ver 01.00.07 (in-game "VER 1.0.4")
# ★ THIS IS THE ARCHIVE WE SHIP. `app_info` in
# `android_app/app/src/main/assets/hero3_fixed.zip` reads `Ver:01.00.07` and its
# `binary.mod` hashes to 6a352944…. The in-game splash says "VER 1.0.4" (an EA Korea
# build stamp at .rodata 0x5b28c), which is NOT the package version — package 01.00.04
# shows "VER 1.0.1" in-game. Do not let the two numbering schemes swap the entries:
# every hook below is verified against 6a352944 and only that binary.
# ---------------------------------------------------------------------------
# The LGT carrier build is a DIFFERENT compile of the game (no byte-level overlap
# with the KTF client.bin — even the save DB name strings differ), so nothing from
# the KTF entry transfers by address. This entry is the start of the LGT port.
#
# The blitter was found the same way the KTF one was: a sampled guest profile of
# the probe driving the opening battle scene (2026-08-10) puts the top non-idle
# leaf PCs at 0x2e59c/0x2e5b4/0x2e5c2 (~16%) — the inner loops of one function
# whose prologue is at 0x2dd7c. Instruction-level comparison against the KTF
# blitter shows IDENTICAL semantics: 13 args in the same order, fmt 0x0b = 4bpp
# high-nibble-first / 0xc = 8bpp, index 0 transparent, RGB565 palette stores,
# pixels = data + 2*palette_len + 9, 4bpp row bytes = ceil(pitch/2), odd srcX
# starts on a LOW nibble. The one difference is the sprite descriptor: +8/+0xc
# are direct pointers (KTF: allocator handles) — hence kind = "blit565_lgt".
[[entry]]
name = "Hero3 binary.mod (LGT)"
hash = "6a352944bb43c0789ca9f4b6f0702f4b"

[[entry.hook]]
kind = "blit565_lgt"
pc = 0x2dd7d

# `blendRect` — the semi-transparent rectangle fill (MIGRATION_LGT.md §2.17).
#
# Profiling a field run put ~21 % of all guest samples inside its inner loop
# (0x2b790..0x2b816), spread evenly over ~35 instructions: ~44 guest instructions PER
# PIXEL. Every menu panel, dialogue bar, HUD panel and fade goes through it, so a
# full-screen 240x320 fade is ~3.4 M guest instructions against ~1.0 M for a whole
# ordinary field frame. That is the frame-drop the player reported, and it is a
# different function from the sprite blitter above.
#
# `pc` is the OUTER row loop's first instruction (`ldr r4,[sp,#0x28]`, halfword 0x9c0a,
# branched back to from 0x2b836), so one hook finishes the whole rectangle. Everything
# it needs is already on the frame there — 0x2b784 has just stored the row count.
#
# `exit_pc` is the function's shared tail (`add sp,#0x5c; pop {r4-r7}; pop {r0}; bx r0`).
# It is reached by the two DO-NOTHING early exits — 0x2b71a when alpha is 0 and 0x2b776
# when the height is not positive — which is the proof that it cannot depend on any
# register or stack state the loop would have produced.
#
# Not added to the 01.00.04 entry below: that revision's `.text` is 0x144 bytes longer
# and this address was only ever verified on 6a352944. Locate it there before adding it.
[[entry.hook]]
kind = "blend565_lgt"
exit_pc = 0x2b8d7
pc = 0x2b787

# The LUT-blended palettised sprite blitter — the CRITICAL-HIT / skill-effect path
# (MIGRATION_LGT.md §2.20). Third and last of the game's per-pixel loops: `blit565` above
# draws opaque sprites and `blend565` fills translucent rectangles, so a translucent
# SPRITE was landing on neither, which is why the player still saw a frame drop whenever a
# critical flash was on screen after those two shipped.
#
# `pc` is the function ENTRY (`push {r4-r7,lr}`, halfword 0xb5f0) — the same shape as the
# blit565 hook, so declining runs the displaced push and resumes two bytes on. Found by
# differencing a probe profile of the intro battle (frames ~3000..4200) against one that
# stops before it: the fight doubles the samples in an evenly spread cluster at
# 0x2ea38..0x2eba6, which is this function's transform-0 pixel loop.
#
# The three tables are the arguments the host cannot derive:
#   alpha_map = .data byte table at the literal in 0x2ec64 — translates the per-sprite
#               blend argument into a plane index.
#   blend_t   = .bss planes at the literal in 0x2ec68, indexed by that translated level.
#   blend_a   = .bss planes at the literal in 0x2ec6c, indexed by the per-call level; the
#               guest skips this second stage entirely when that level is > 0xfe.
# Both plane sets are BUILT AT RUNTIME by the game, so the hook reads them out of guest
# memory per call rather than caching anything across calls.
[[entry.hook]]
kind = "blit_lut565_lgt"
alpha_map = 0x14001bf
blend_t = 0x150f8cc
blend_a = 0x150eccc
pc = 0x2e8c5

# `tintRect` — the per-pixel LUT COLOUR TRANSFORM of a rectangle already on screen, and
# the REAL cost of a critical hit (PLAY_FEEDBACK_FIXES.md 49차). It is the function
# immediately after `blendRect`, starting at 0x2b8f8, and nothing was hooking it.
#
# The three hooks above did not touch it because it is not a blitter: it takes no source
# pixels at all. Measured on the device (S25, vc79) with a per-tick hitch report and the
# guest PC profiler, which is what finally separated it from everything else:
#
#   normal tick   25 ms   inst   0.65 M   blit 569/576   hot pc 0x8=60% (idle)
#   crit   tick  124 ms   inst  16.05 M   blit 573/582   hot pc 0x2b998 0x2b99a 0x2b99e …
#
# Same blits, same ~140 K pixels, same ~1,300 SVCs, 3 allocations, no sound parse — 25x
# the guest instructions and nothing else moved. Every hot PC sits in 0x2b98e..0x2b9ea.
# (This also retires the standing §2.20 suspicion that the blitlut565 transform 4~8
# fallback was to blame: during that same combat the host drew 98.8 % of blits and the
# transform refusals ran at ~5/s against ~10,600 calls/s.)
#
# `pc` is the OUTER row loop's first instruction (`ldr r1,[sp,#8]`, halfword 0x9902,
# branched back to from 0x2b9fc), so one hook finishes the whole rectangle — the same
# shape, and the same reasoning, as the blend565_lgt hook above.
#
# `exit_pc` is the function's shared tail (`add sp,#0x34; pop {r4-r7}; pop {r0}; bx r0`).
# It is reached by three DO-NOTHING early exits — 0x2b912 when level is 255, 0x2b97e when
# the height is not positive, 0x2ba02 likewise on the 32-bit path — which is the proof it
