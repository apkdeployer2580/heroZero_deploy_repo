#
# `blend_a` is the byte table the pixel loop indexes as
# `LUT + level*1024 + channel*32 + sel`, read from the literal at 0x2baa8. It is the SAME
# 0x150eccc the blit_lut565_lgt hook above already takes as `blend_a` — an independent
# cross-check, since that hook derived the identical level/selector layout from a
