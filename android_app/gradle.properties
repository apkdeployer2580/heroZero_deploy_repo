org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# ── compileSdk 36 on AGP 8.7.2 ──────────────────────────────────────────────
# AGP 8.7.2 was tested up to compileSdk 35, so 36 makes it print an "untested
# combination" warning. The build is fine — verified 2026-09-08 from the ARTIFACT,
# not from the build log: `aapt2 dump badging app-debug.apk` reports
#   compileSdkVersion='36'  targetSdkVersion='36'  minSdkVersion='26'
# and the entire Java surface of this app is one file (MainActivity.java) against
# stable platform APIs, so there is nothing here for a newer android.jar to break.
#
# This line suppresses ONLY that warning; it changes nothing about what is built.
# ⛔ If a build ever starts behaving oddly, DELETE THIS LINE FIRST and read the
# warning back before assuming the cause is elsewhere. Remove it for good when AGP
# is bumped past 8.7.2 (AGP 8.9+ is tested against 36).
android.suppressUnsupportedCompileSdk=36
