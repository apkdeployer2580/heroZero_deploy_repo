# APK version. Read by app/build.gradle.kts; `versionCode` is bumped by
# `build_android.ps1 -Release` and by nothing else (debug builds and IDE syncs leave it alone).
#
# ASCII ONLY: rewritten by that script and read by Java's Properties.load() (ISO-8859-1).
#
# versionCode must STRICTLY INCREASE for every build handed out - Android refuses an install
# whose code is not higher than the installed one. versionName is what players see.
versionCode=64
versionName=0.1.0
